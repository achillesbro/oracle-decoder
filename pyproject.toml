[project]
name = "oracle-decoder"
version = "0.1.0"
description = "Resolve the identity of a Morpho Blue market oracle from its address: composition, publishers, evidence grade."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "web3>=7",
    "httpx>=0.27",
]

[project.scripts]
oracle-decoder = "oracle_decoder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle_decoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
